{% extends 'base.html' %}{% block content %}
<div class="container auth-wrap py-5"><div class="soft-card p-4 p-md-5"><h2 class="fw-bold">Welcome back</h2><p class="text-muted">Login to your LocalConnect account.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label">Email or Username</label><input class="form-control form-control-lg" type="text" name="email" placeholder="Email or Username" maxlength="190" required autocomplete="username"></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control form-control-lg" type="password" name="password" required autocomplete="current-password"></div><button class="btn btn-primary btn-lg w-100">Login</button></form><div class="d-flex justify-content-between mt-3"><a href="{{ lc_url('auth/forgot-password.php') }}">Forgot password?</a><a href="{{ lc_url('auth/resend-verification.php') }}">Resend verification</a></div><p class="text-center text-muted mt-3 mb-0">New here? <a href="{{ lc_url('auth/register.php') }}">Create account</a></p></div></div>
{% endblock %}
